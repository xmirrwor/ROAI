<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniDuck 2 m Race</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101214;
      color: #f5f7f8;
      font-family: Arial, sans-serif;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #101214;
    }
    .label {
      position: fixed;
      left: 16px;
      top: 16px;
      padding: 8px 11px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 4px;
      background: rgba(12, 14, 16, 0.82);
      font-size: 14px;
      line-height: 1.45;
      pointer-events: none;
    }
    .start { color: #55a6ff; }
    .finish { color: #52e879; }
  </style>
</head>
<body>
  <video autoplay muted loop controls playsinline>
    <source src="evaluation/race_2m/visualization/race_2m_validation.mp4?v=3" type="video/mp4">
  </video>
  <div class="label">
    MiniDuck 2 m race, lateral command 0.26 m/s<br>
    <span class="start">Blue: start</span> &nbsp; <span class="finish">Green: finish</span>
    &nbsp; Yellow: center line
  </div>
</body>
</html>
